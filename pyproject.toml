[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videounderstander"
version = "0.1.0"
description = "Turn videos into verified, text-first artifacts that Claude can consume"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
vu = "vu.cli:main"

[tool.setuptools.packages.find]
include = ["vu*"]
